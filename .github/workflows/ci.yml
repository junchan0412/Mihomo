name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: mihomo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: SwiftPM Tests
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Xcode toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # GitHub's current macos-latest image provides 26.6.0; local release
          # verification continues to use the explicitly selected Xcode 27.0 beta.
          xcode-version: "26.6.0"

      - name: Verify pinned Xcode toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version | awk '/Xcode/{print $2}')" = "26.6"

      - name: Check whitespace
        run: git diff --check

      - name: Run tests
        run: swift test

      - name: Verify release bundle structure
        run: ./script/ci_release_gate.sh
